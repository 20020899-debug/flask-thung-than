<!DOCTYPE html>
<html>
<head>
    <title>Gộp PDF</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% include "menu.html" %}

<div class="box">

    <h2>📑 Gộp PDF</h2>

    <form action="/merge-pdf/run"
          method="post"
          enctype="multipart/form-data">

        <div id="drop-area">

            <h3>Kéo thả PDF vào đây</h3>

            <p>hoặc</p>

            <input
                type="file"
                id="pdfs"
                name="pdfs"
                multiple
                accept=".pdf">

        </div>

        <p>
            <strong>Số file:</strong>
            <span id="file-count">0</span>
        </p>

        <div id="file-list"></div>

        <br>

        <button type="submit">
            📑 Gộp PDF
        </button>

    </form>

</div>

<script>

let allFiles = [];

const input = document.getElementById("pdfs");
const fileList = document.getElementById("file-list");
const fileCount = document.getElementById("file-count");
const dropArea = document.getElementById("drop-area");


function refreshList(){

    fileList.innerHTML = "";

    allFiles.forEach((file, index) => {

        const row = document.createElement("div");
        row.className = "pdf-row";
        row.draggable = true;
        row.dataset.index = index;

        row.innerHTML = `
            <span>☰ 📄 ${file.name}</span>
            <button type="button" onclick="removeFile(${index})">❌</button>
        `;

        // Drag start
        row.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("from", index);
        });

        // Drag over
        row.addEventListener("dragover", (e) => {
            e.preventDefault();
        });

        // Drop (đổi vị trí)
        row.addEventListener("drop", (e) => {
            e.preventDefault();

            let fromIndex = e.dataTransfer.getData("from");
            let toIndex = index;

            if(fromIndex == toIndex) return;

            let movedItem = allFiles.splice(fromIndex, 1)[0];
            allFiles.splice(toIndex, 0, movedItem);

            refreshList();
        });

        fileList.appendChild(row);
    });

    fileCount.textContent = allFiles.length;

    // cập nhật lại input file
    const dt = new DataTransfer();

    allFiles.forEach(file => dt.items.add(file));

    input.files = dt.files;
}


// Xóa file
function removeFile(index){
    allFiles.splice(index, 1);
    refreshList();
}


// chọn file
input.addEventListener("change", () => {
    allFiles.push(...input.files);
    refreshList();
});


// kéo thả vào vùng upload
dropArea.addEventListener("dragover", e => {
    e.preventDefault();
});

dropArea.addEventListener("drop", e => {
    e.preventDefault();

    const files = [...e.dataTransfer.files];

    files.forEach(file => {
        if(file.name.toLowerCase().endsWith(".pdf")){
            allFiles.push(file);
        }
    });

    refreshList();
});

</script>

</body>
</html>
